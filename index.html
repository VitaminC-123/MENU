<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quán Chay Thiện Duyên - Thực Đơn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>QUÁN CHAY THIỆN DUYÊN</h1>
        <p class="subtitle">Menu Món Chay — 33/19B Phạm Thái Bường, P. Phước Hậu, Vĩnh Long</p>
        <p class="hotline">Hotline: 0799 792 029</p>
    </header>

    <!-- Thanh Lọc Danh Mục -->
    <nav class="category-bar">
        <button class="category-btn active" onclick="filterMenu('all', event)">Tất cả</button>
        <button class="category-btn" onclick="filterMenu('main', event)">Món kho</button>
        <button class="category-btn" onclick="filterMenu('canh', event)">Canh</button>
        <button class="category-btn" onclick="filterMenu('rau-xao', event)">Rau xào</button>
        <button class="category-btn" onclick="filterMenu('dac-biet', event)">Món đặc biệt</button>
        <button class="category-btn" onclick="filterMenu('snack', event)">Món chiên</button>
        <button class="category-btn" onclick="filterMenu('cuon', event)">Món cuốn</button>
        <button class="category-btn" onclick="filterMenu('goi', event)">Gỏi</button>
        <button class="category-btn" onclick="filterMenu('rice', event)">Cơm & Cơm chiên</button>
        <button class="category-btn" onclick="filterMenu('sup', event)">Súp</button>
        <button class="category-btn" onclick="filterMenu('mi-bun-xao', event)">Mì / Hủ tiếu / Bún xào</button>
        <button class="category-btn" onclick="filterMenu('com-nieu', event)">Cơm niêu</button>
        <button class="category-btn" onclick="filterMenu('lau', event)">Lẩu</button>
        <button class="category-btn" onclick="filterMenu('mon-them', event)">Món thêm lẩu</button>
        <button class="category-btn" onclick="filterMenu('drink', event)">Giải khát</button>
    </nav>

    <!-- Danh sách món ăn -->
    <main class="container" id="menu-list"></main>

    <script src="script.js"></script>
</body>
</html>
